name: PixelOS Floral source integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify checkout recovery and build preflight
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lz4
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/check_noksu_soong_paths.py
      - name: Validate manifest and exercise both standalone plugins against PixelOS
        run: |
          python3 tools/validate.py
          python3 tools/integration_smoke.py
